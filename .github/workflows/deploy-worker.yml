name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'sync-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test website and Worker
        run: node --test app.test.mjs library.test.mjs appearance.test.mjs sync-worker/worker.test.mjs
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to this repository’s Actions secrets.'
            exit 1
          fi
      - name: Configure isolated account password secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KYLE_SITE_PASSWORD: ${{ secrets.KYLE_SITE_PASSWORD }}
          YEELAM_SITE_PASSWORD: ${{ secrets.YEELAM_SITE_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { pbkdf2Sync } from 'node:crypto';
          // Random per-account salts remain stable across deployments so normal
          // releases do not revoke sessions. Passwords and derived keys stay in secrets.
          const salts = { kyle: '3641972d0ff4199fa68f28a1b7766e67', yeelam: 'd2961eba94dc5d6c92e31f2a1bfe67ea' };
          const accounts = ['kyle', 'yeelam'];
          for (const account of accounts) {
            if (!process.env[account.toUpperCase() + '_SITE_PASSWORD']) {
              throw new Error('Add protected Actions secret ' + account.toUpperCase() + '_SITE_PASSWORD before deploying');
            }
          }
          for (const account of accounts) {
            const key = account.toUpperCase();
            const derived = pbkdf2Sync(process.env[key + '_SITE_PASSWORD'], Buffer.from(salts[account], 'hex'), 100000, 32, 'sha256').toString('hex');
            const verifier = 'pbkdf2-sha256:100000:' + salts[account] + ':' + derived;
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/7d9ce07313d77b433c46fdc1a9982d42/workers/scripts/snowy-cake-a0a7/secrets', {
              method: 'PUT', signal: AbortSignal.timeout(15000),
              headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: key + '_PASSWORD_VERIFIER', text: verifier, type: 'secret_text' }),
            });
            const result = await response.json();
            if (!response.ok || result.success !== true) throw new Error('Could not configure protected Worker password for ' + account + ' (HTTP ' + response.status + ')');
            console.log('Configured protected password verifier for ' + account);
          }
          NODE
      - name: Deploy Worker
        id: deploy_worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d9ce07313d77b433c46fdc1a9982d42
          workingDirectory: sync-worker
          wranglerVersion: '4'
          command: deploy --keep-vars
      - name: Deploy through the version API when dashboard configuration checks fail
        if: steps.deploy_worker.outcome == 'failure'
        working-directory: sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7d9ce07313d77b433c46fdc1a9982d42
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';

          // This CLI's version upload does not require the dashboard route preview.
          // keep_vars in wrangler.toml retains existing variables and secrets.
          function wrangler(args, capture = false) {
            const result = spawnSync('npx', ['--yes', 'wrangler@4.58.0', ...args], {
              stdio: capture ? 'pipe' : 'inherit', encoding: 'utf8', maxBuffer: 10 * 1024 * 1024,
            });
            if (capture) {
              process.stdout.write(result.stdout || '');
              process.stderr.write(result.stderr || '');
            }
            if (result.error || (!capture && result.status !== 0)) throw new Error('Version API deployment failed');
            return result;
          }
          const message = 'Source commit ' + process.env.GITHUB_SHA;
          const upload = wrangler(['versions', 'upload', '--message', message], true);
          // The upload can succeed before URL discovery fails for a token without
          // account-subdomain read permission. Verify that exact upload via its API.
          const id = upload.stdout?.match(/^Worker Version ID: ([a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12})\s*$/im)?.[1];
          if (!id) {
            throw new Error('No valid uploaded Worker version ID');
          }
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' +
            process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/snowy-cake-a0a7/versions/' + id, {
              headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN },
              signal: AbortSignal.timeout(15000),
            });
          const verified = await response.json();
          if (!response.ok || verified.success !== true || verified.result?.id !== id ||
              verified.result?.annotations?.['workers/message'] !== message) {
            throw new Error('Uploaded version does not match this source commit');
          }
          wrangler(['versions', 'deploy', id + '@100%', '--yes']);
          NODE
      - name: Verify deployed Worker health
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('sync-worker/worker.js', 'utf8');
          const expectedVersion = source.match(/^const SERVICE_VERSION = ['"]([^'"]+)['"];?$/m)?.[1];
          if (!expectedVersion) throw new Error('SERVICE_VERSION missing from Worker source');

          const url = 'https://snowy-cake-a0a7.3355718646.workers.dev/health';
          let lastError;
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(url, {
                headers: { 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
              const health = await response.json();
              if (health.ok !== true || health.service !== 'kyle-dse-quiz-sync'
                  || health.version !== expectedVersion || health.passwordConfigured !== true
                  || health.aiConfigured !== true || health.aiProvider !== 'DeepSeek'
                  || health.aiModel !== 'deepseek-flash' || health.aiFiguresEnabled !== true) {
                throw new Error(`Unexpected /health response: ${JSON.stringify(health)}`);
              }
              console.log(`Verified ${health.service} ${health.version}; password configured`);
              console.log(`AI configured: ${health.aiConfigured === true}; model: ${health.aiModel}; optional figures: ${health.aiFiguresEnabled === true}`);
              lastError = null;
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 6) {
                console.warn(`Health check ${attempt}/6 failed: ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
          }
          if (lastError) throw lastError;
          NODE

      - name: Verify isolated account login without writing practice records
        env:
          KYLE_SITE_PASSWORD: ${{ secrets.KYLE_SITE_PASSWORD }}
          YEELAM_SITE_PASSWORD: ${{ secrets.YEELAM_SITE_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://snowy-cake-a0a7.3355718646.workers.dev';
          const origin = 'https://makise-kurisu-d.github.io';
          for (const username of ['Kyle', 'Yeelam']) {
            const response = await fetch(base + '/auth/password', {
              method: 'POST', signal: AbortSignal.timeout(15000),
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password: process.env[username.toUpperCase() + '_SITE_PASSWORD'] }),
            });
            const session = await response.json();
            if (!response.ok || session.userId !== username.toLowerCase() || !/^[A-Za-z0-9_-]{40,80}$/.test(session.sessionId || '')) {
              throw new Error('Account login verification failed for ' + username + ' (HTTP ' + response.status + ')');
            }
            try {
              if (username === 'Yeelam') {
                const upgrade = await fetch(base + '/auth/upgrade', { method: 'POST', signal: AbortSignal.timeout(15000),
                  headers: { Origin: origin, Authorization: 'Bearer ' + session.sessionId } });
                if (upgrade.status !== 403) throw new Error('Guest privilege isolation check failed');
              }
            } finally {
              const logout = await fetch(base + '/auth/logout', { method: 'POST', signal: AbortSignal.timeout(15000),
                headers: { Origin: origin, Authorization: 'Bearer ' + session.sessionId } });
              if (!logout.ok) throw new Error('Verification session cleanup failed');
            }
            console.log('Verified isolated login for ' + username + '; no practice records written');
          }
          NODE
