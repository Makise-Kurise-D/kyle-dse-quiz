name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'sync-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test website and Worker
        run: node --test app.test.mjs library.test.mjs appearance.test.mjs sync-worker/worker.test.mjs
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to this repository’s Actions secrets.'
            exit 1
          fi
      - name: Deploy Worker
        id: deploy_worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d9ce07313d77b433c46fdc1a9982d42
          workingDirectory: sync-worker
          wranglerVersion: '4'
          command: deploy --keep-vars
      - name: Deploy through the version API when dashboard configuration checks fail
        if: steps.deploy_worker.outcome == 'failure'
        working-directory: sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7d9ce07313d77b433c46fdc1a9982d42
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';

          // This CLI's version upload does not require the dashboard route preview.
          // keep_vars in wrangler.toml retains existing variables and secrets.
          const output = join(process.env.RUNNER_TEMP, 'worker-version-upload.ndjson');
          function wrangler(args, extraEnv = {}) {
            const result = spawnSync('npx', ['--yes', 'wrangler@4.58.0', ...args], {
              stdio: 'inherit', env: { ...process.env, ...extraEnv },
            });
            if (result.error || result.status !== 0) throw new Error('Version API deployment failed');
          }
          wrangler(['versions', 'upload'], { WRANGLER_OUTPUT_FILE_PATH: output });
          const records = readFileSync(output, 'utf8').trim().split('\n').map(line => JSON.parse(line));
          const id = records.findLast(record => record.type === 'version-upload')?.version_id;
          if (!/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(id || '')) {
            throw new Error('No valid uploaded Worker version ID');
          }
          wrangler(['versions', 'deploy', id + '@100%', '--yes']);
          NODE
      - name: Verify deployed Worker health
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('sync-worker/worker.js', 'utf8');
          const expectedVersion = source.match(/^const SERVICE_VERSION = ['"]([^'"]+)['"];?$/m)?.[1];
          if (!expectedVersion) throw new Error('SERVICE_VERSION missing from Worker source');

          const url = 'https://snowy-cake-a0a7.3355718646.workers.dev/health';
          let lastError;
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(url, {
                headers: { 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) throw new Error(`Health endpoint returned HTTP ${response.status}`);
              const health = await response.json();
              if (health.ok !== true || health.service !== 'kyle-dse-quiz-sync'
                  || health.version !== expectedVersion || health.passwordConfigured !== true) {
                throw new Error(`Unexpected /health response: ${JSON.stringify(health)}`);
              }
              console.log(`Verified ${health.service} ${health.version}; password configured`);
              console.log(`AI configured: ${health.aiConfigured === true}`);
              lastError = null;
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 6) {
                console.warn(`Health check ${attempt}/6 failed: ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
          }
          if (lastError) throw lastError;
          NODE

