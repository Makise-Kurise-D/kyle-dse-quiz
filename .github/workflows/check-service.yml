name: Check live sync service

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-service.yml'
      - 'app.js'
      - 'app.test.mjs'
      - 'index.html'
      - 'library.js'
      - 'library.css'
      - 'style.css'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Cloudflare Worker']
    types: [completed]

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.repository.default_branch }}
      - name: Test website and Worker
        run: node --test app.test.mjs library.test.mjs sync-worker/worker.test.mjs
      - name: Probe health and password login reachability
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expectedVersion = readFileSync('sync-worker/worker.js', 'utf8').match(/^const SERVICE_VERSION = ['"]([^'"]+)['"];?$/m)?.[1];
          if (!expectedVersion) throw new Error('Missing expected Worker version');
          const base = 'https://snowy-cake-a0a7.3355718646.workers.dev';
          const origin = 'https://makise-kurisu-d.github.io';
          const probes = [
            { name: 'health', path: '/health', expected: r => r.status === 200 && r.body.ok === true && r.body.passwordConfigured === true && r.body.version === expectedVersion },
            { name: 'login-preflight', path: '/auth/password', options: { method: 'OPTIONS',
              headers: { Origin: origin, 'Access-Control-Request-Method': 'POST', 'Access-Control-Request-Headers': 'content-type' } },
              expected: r => r.status === 204 && r.allowOrigin === origin },
            { name: 'login-route', path: '/auth/password', options: { method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' }, body: '{}' },
              expected: r => r.status === 401 && r.body.error === 'invalid_password' },
            { name: 'login-storage', path: '/auth/password', options: { method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: 'diagnostic-intentionally-invalid-password' }) },
              expected: r => (r.status === 401 && r.body.error === 'invalid_password') || (r.status === 429 && r.body.error === 'too_many_attempts') },
          ];
          await Promise.all(probes.map(async probe => {
            const started = Date.now();
            try {
              let response, body;
              const attempts = probe.name === 'health' ? 5 : 1;
              for (let attempt = 1; attempt <= attempts; attempt++) {
                const path = probe.path + (probe.name === 'health' ? '?probe=' + Date.now() : '');
                response = await fetch(base + path, { ...probe.options, cache: 'no-store', signal: AbortSignal.timeout(15000) });
                body = response.status === 204 ? {} : await response.json();
                if (probe.name !== 'health' || (response.ok && body.version === expectedVersion) || attempt === attempts) break;
                console.warn(JSON.stringify({ probe: 'health-propagation', expectedVersion, observedVersion: body.version, attempt }));
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
              const result = { probe: probe.name, status: response.status, elapsedMs: Date.now() - started,
                allowOrigin: response.headers.get('access-control-allow-origin'),
                preflightMaxAge: response.headers.get('access-control-max-age'),
                body: probe.name === 'health' ? { expectedVersion, ok: body.ok, version: body.version, passwordConfigured: body.passwordConfigured } : { error: body.error } };
              console.log(JSON.stringify(result));
              if (!probe.expected(result)) process.exitCode = 1;
            } catch (error) {
              console.error(JSON.stringify({ probe: probe.name, elapsedMs: Date.now() - started, error: error.name }));
              process.exitCode = 1;
            }
          }));
          NODE
      - name: Verify published homepage and versioned assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const base = 'https://makise-kurisu-d.github.io/kyle-dse-quiz/';
          const index = readFileSync('index.html', 'utf8');
          const assets = [...index.matchAll(/(?:src|href)="((?:app|library)\.js\?v=[^"\s]+|(?:style|library)\.css\?v=[^"\s]+|images\/avatar\.jpg\?v=[^"\s]+)"/g)].map(m => m[1]);
          if (assets.length !== 5) throw new Error('Missing versioned website assets or avatar favicon');
          let lastError;
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const response = await fetch(base + '?probe=' + Date.now(), { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              const html = await response.text();
              if (!response.ok || !assets.every(asset => html.includes(asset))) throw new Error('Homepage unavailable or awaiting current Pages release: HTTP ' + response.status);
              await Promise.all(assets.map(async asset => {
                const result = await fetch(new URL(asset + '&probe=' + Date.now(), base), { cache: 'no-store', signal: AbortSignal.timeout(10000) });
                if (!result.ok || !Buffer.from(await result.arrayBuffer()).equals(readFileSync(asset.split('?')[0]))) throw new Error('Published asset differs or is unavailable: ' + asset + ' HTTP ' + result.status);
              }));
              console.log(JSON.stringify({ probe: 'published-website', status: response.status, assets, attempt }));
              lastError = null;
              break;
            } catch (error) {
              lastError = error;
              console.warn(JSON.stringify({ probe: 'pages-propagation', attempt, error: error.message }));
              if (attempt < 24) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          if (lastError) throw lastError;
          NODE

