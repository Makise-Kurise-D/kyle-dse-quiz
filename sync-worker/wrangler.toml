# Cloudflare Workers Builds: main branch, root directory sync-worker.
# Build command: none. Deploy command: npx wrangler deploy --keep-vars.
name = "snowy-cake-a0a7"
main = "worker.js"
compatibility_date = "2026-10-08"
# Keep dashboard-managed variables and secrets in both deployment paths.
keep_vars = true

# Set SITE_PASSWORD as a Worker secret, alongside SESSION_SECRET and GITHUB_CLIENT_SECRET.
# The owner's existing OAuth connection initializes private storage on the first visit.
# GITHUB_TOKEN is an optional server-only alternative for repository access.
# DeepSeek: add DEEPSEEK_API_KEY as a Worker secret. The API base is official;
# DEEPSEEK_MODEL optionally selects deepseek-flash (default) or deepseek-v4-pro.
# Thinking uses high effort, with no local output token cap or automatic API retry.
# These models accept text only; private figures are never sent to DeepSeek.
# A custom provider instead requires all of AI_BASE_URL, AI_MODEL and AI_API_KEY.
# AI_VISION="true" explicitly permits figures only for a custom vision provider.
# Limits: 20 calls/session/Beijing day, 80/service/day, 10 seconds between requests.
# KV limits are best-effort across Cloudflare regions; each isolate also blocks overlap.

[[kv_namespaces]]
binding = "SESSIONS"
id = "abf716fb1a6b49338835370ac0026569"

[vars]
GITHUB_CLIENT_ID = "Iv23liDCF1nzb5DgalhR"
