# Cloudflare Workers Builds: main branch, root directory sync-worker.
# Build command: none. Deploy command: npx wrangler deploy --keep-vars.
name = "snowy-cake-a0a7"
main = "worker.js"
compatibility_date = "2026-10-08"
# Keep dashboard-managed variables and secrets in both deployment paths.
keep_vars = true

# Set SITE_PASSWORD as a Worker secret, alongside SESSION_SECRET and GITHUB_CLIENT_SECRET.
# The owner's existing OAuth connection initializes private storage on the first visit.
# GITHUB_TOKEN is an optional server-only alternative for repository access.
# DeepSeek: add DEEPSEEK_API_KEY as a Worker secret. The API base is official;
# New DeepSeek calls use only deepseek-flash (4.1 Flash); Pro is disabled.
# AI is available for submitted-answer review and follow-up only, at high effort.
# Practice hints and scaffolds are disabled; per-question input labels are authored
# in private answerFields metadata and do not call any model during practice.
# No local output token cap or automatic API retry.
# Native vision is available; figures are sent only after the user opts in.
# A custom provider instead requires all of AI_BASE_URL, AI_MODEL and AI_API_KEY.
# Optional independent HTTPS fallback: AI_FALLBACK_BASE_URL, AI_FALLBACK_MODEL,
# AI_FALLBACK_API_KEY (secret), plus AI_FALLBACK_VISION="true" for opt-in images.
# One attempt per provider; transport/auth/balance/rate-limit errors can fail over.
# Invalid evidence never triggers failover. Primary cools down for 60 seconds.
# Argon currently has only a private Git relay, not a production HTTPS endpoint;
# leave fallback unset until an independent service is configured and tested.
# AI_VISION="true" enables the optional figure checkbox for supported providers.
# Limits: 20 calls/user/Beijing day, 80/service/day, 10 seconds between requests.
# KV limits are best-effort across Cloudflare regions; each isolate also blocks overlap.

[[kv_namespaces]]
binding = "SESSIONS"
id = "abf716fb1a6b49338835370ac0026569"

[vars]
GITHUB_CLIENT_ID = "Iv23liDCF1nzb5DgalhR"
DEEPSEEK_MODEL = "deepseek-flash"
AI_VISION = "true"



# Account passwords are protected Worker secrets: KYLE_PASSWORD_VERIFIER and
# YEELAM_PASSWORD_VERIFIER (pbkdf2-sha256:100000:<salt hex>:<derived key hex>).
# Never place password verifiers in public source or [vars].
